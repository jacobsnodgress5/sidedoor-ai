# Exclusions (Regex patterns applied to title and description)
exclusions:
  # Discard if job title matches any of these (case-insensitive)
  job_titles:
    - "senior"
    - "sr\\."
    - "lead"
    - "principal"
    - "director"
    - "manager"
    - "staff"
    - "head of"
    - "vp"
    - "architect"
  
  # Discard if job description requires these years of experience
  # Matches "4+ years", "5+ years", "6 years", etc.
  experience_regex: "\\b([4-9]|\\d{2})\\+\\s*(years|yrs)\\b|\\b([4-9]|\\d{2})\\s*(years|yrs)\\s+of\\s+experience\\b"
  
  # Discard if description requires an active security clearance
  clearance_regex: "(?i)\\b(must\\s+(possess|hold|have)|require(s)?)\\s+an?\\s+active\\s+(secret|top\\s+secret|ts/sci|clearance)\\b"

# Notification Settings
email:
  # Set to true to send emails, or false to use local Windows desktop notifications + browser auto-open
  enabled: false
  # The sender email (you can use a dummy Gmail account created just for this purpose)
  sender: "jacobsscrapehelper@gmx.com"
  receiver: "jacobsnodgress5@gmail.com"
  smtp_server: "mail.gmx.com"
  smtp_port: 587
  # Paste your Gmail App Password here directly. Alternatively, leave this blank
  # and set the LINKEDIN_EMAIL_PASSWORD environment variable.
  password: ""
  password_env_var: "LINKEDIN_EMAIL_PASSWORD"

# LLM Configuration
llm:
  # The Gemini model to use. gemini-3.5-flash is ultra-fast and reliable.
  model: "gemini-3.5-flash"
  # Paste your Gemini API key here directly. Alternatively, leave this blank
  # and set the GEMINI_API_KEY environment variable (already configured in .env).
  api_key: ""
  # Environment variable where the Gemini API key is stored (fallback)
  api_key_env_var: "GEMINI_API_KEY"
