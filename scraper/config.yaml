# LinkedIn Job Scraper & Filter Configuration

# Search Parameters
search:
  # The list of search terms.
  keywords:
    - "data scientist entry level"
    - "data analyst entry level"
    - "data engineer entry level"
    - "machine learning engineer entry level"
  
  # Search experience levels (using LinkedIn's official search filters):
  # 1 = Internship, 2 = Entry Level, 3 = Associate, 4 = Mid-Senior, 5 = Director, 6 = Executive
  # Note: Left empty [] per plan to let search terms and python stage 1 handle filtering.
  experience_levels: []
  
  # Search geography parameters (Default: Los Angeles, CA area)
  geo_id: "102448103"      # LinkedIn's ID for Los Angeles Metropolitan Area
  distance: 50             # Distance in miles
  time_range: "r86400"     # r86400 = past 24 hours. Use "" (empty string) for any time.
  max_applicants: 100      # Discard job card if applicants exceed this count
  max_pages: 1             # Search depth (N pages of results per keyword)

# Candidate Profile (Used by LLM for alignment verification)
profile:
  name: "Jacob Snodgress"
  education:
    degree: "B.S. in Applied Mathematics (Specialization in Computing)"
    minor: "Data Science Engineering"
    university: "University of California, Los Angeles (UCLA)"
    graduation_date: "June 2026 (Graduated)"
    gpa: "3.64"
    coursework:
      - "Algorithms and Complexity"
      - "Data Science"
      - "Machine Learning"
      - "Natural Language Processing"
      - "Statistical Analysis"
      - "Optimization"
      - "Mathematical Game Theory"
  
  experience:
    - role: "Research Data Scientist"
      company: "Atmospheric Sciences Department, UCLA"
      duration: "Sept 2024 - Present"
      description: "Engineered predictive mathematical models and tracking algorithms to process massive spatiotemporal datasets. Managed documentation and iteration cycles for academic publication."
  
  skills:
    programming:
      - "Python"
      - "C++"
